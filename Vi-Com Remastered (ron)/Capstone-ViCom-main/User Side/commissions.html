<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViCom | My commissions</title>
  <link rel="stylesheet" href="../commission.css">
</head>
<body>
  <header class="comm-topbar">
    <a class="brand" href="index.html"><span class="brand-mark">V</span><span>ViCom</span></a>
    <nav><a href="index.html">Explore</a><a href="discover.html">Discover</a><a href="commissions.html">My commissions</a></nav>

    <aside class="comm-sidebar" id="comm-sidebar"></aside>

  <script src="../commission.js"></script>
  <script>new CommissionTracker({ role: 'customer' }).mount();</script>
