<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViCom | My Commissions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
  <link rel="stylesheet" href="../commission.css">
</head>
<body>

  <!-- topbar matches User Side/index.html exactly -->
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">V</span>
      <span>ViCom</span>
    </a>
    <div class="search-wrap">
      <span>⌕</span>
      <input id="search-input" type="search" placeholder="Search artists, styles, or ideas" aria-label="Search">
    </div>
    <nav>
      <a href="index.html#explore">Explore</a>
      <a href="discover.html">Discover</a>
      <a class="active" href="commissions.html">My commissions</a>
    </nav>
    <button class="icon-button" id="bell" aria-label="Notifications">◔</button>
    <a class="profile" id="profile-initials" href="../Account%20functions/profile.html" aria-label="Edit profile">--</a>
    <button class="logout-button" id="logout">Log out</button>
    <a class="discover-shortcut" href="discover.html">Discover</a>
  </header>

  <!-- page heading -->
  <div style="padding:40px 9vw 0;display:flex;align-items:flex-end;justify-content:space-between;gap:16px">
    <div>
      <p class="kicker">Your activity</p>
      <h1 style="font:600 clamp(32px,4vw,48px)/.95 'Playfair Display',serif;letter-spacing:-.05em;margin:0 0 8px">
        Keep an eye<br>on your <em>ideas.</em>
      </h1>
      <p style="color:#64776a;font-size:13px;margin:0">Track every stage of your commission, from first sketch to final delivery.</p>
    </div>
  </div>

  <!-- commission tracker -->
  <div class="commission-page" style="margin-top:28px;border-top:1px solid #c7d8cc">
    <div class="comm-sidebar" id="comm-sidebar">
      <p class="comm-empty" style="padding:20px 8px;color:#8aa396;font-size:13px">Loading…</p>
    </div>
    <div class="comm-main" id="comm-main"></div>
  </div>

  <footer>
    <a class="brand" href="index.html">
      <span class="brand-mark">V</span>
      <span>ViCom</span>
    </a>
    <span>Art for the wonderfully specific.</span>
    <span>Help · Terms · Privacy</span>
  </footer>

  <div class="toast" id="toast" role="status"></div>

  <script src="../commission.js"></script>
  <script>
    /* load user info from session */
    (function() {
      try {
        const sess = JSON.parse(localStorage.getItem('vicom-session') || 'null');
        if (sess?.name) {
          const el = document.querySelector('#profile-initials');
          if (el) el.textContent = sess.name.split(/\s+/).map(p=>p[0]).join('').slice(0,2).toUpperCase();
        }
      } catch {}
    })();

    document.querySelector('#bell')?.addEventListener('click', async () => {
      const t = document.querySelector('#toast');
      try {
        const sess = JSON.parse(localStorage.getItem('vicom-session') || 'null');
        if (!sess?.userId) { t.textContent = 'Sign in to see notifications'; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); return; }
        const res  = await fetch(`../Account%20functions/api.php?action=notifications&userId=${encodeURIComponent(sess.userId)}`);
        const data = await res.json();
        const list = data.notifications || [];
        t.textContent = list.length ? '🔔 ' + list[0].text : 'You are all caught up';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2600);
      } catch { t.textContent = 'Could not load notifications'; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
    });

    document.querySelector('#logout')?.addEventListener('click', () => {
      localStorage.removeItem('vicom-session');
      window.location.href = '../LandingPage/index.html';
    });

    /* boot tracker as customer - uses DB */
    const tracker = new CommissionTracker({ role: 'customer' });
    tracker.mount();
  </script>
</body>
</html>
